<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack ゆあ 店舗管理 v3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
function memberCardUrl(token){
  return location.origin + location.pathname.replace(/[^/]+$/, '') + 'member.html?card=' + encodeURIComponent(token);
}
async function copyMemberCard(token){
  const url = memberCardUrl(token);
  try { await navigator.clipboard.writeText(url); alert('お客様用の会員証URLをコピーしました'); }
  catch(e) { prompt('このURLをお客様に送ってください', url); }
}

</script>
<style>*{box-sizing:border-box}body{margin:0;background:#0b090b;color:#f6ecd6;font-family:system-ui,"Yu Gothic",sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px 60px}h1{text-align:center;color:#e3c172}.panel{background:#171117;border:1px solid #70572c;border-radius:18px;padding:18px;margin:16px 0}input,button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #80652f;font-size:16px}input{background:#0e0b0e;color:#fff}button{background:linear-gradient(135deg,#b98a36,#f0d58a);color:#1b1208;font-weight:800}.sub{background:#2a222a;color:#eee}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.member{padding:15px 0;border-bottom:1px solid #403521}.big{font-size:26px;color:#e5c374;font-weight:800}.msg{color:#e5c374;min-height:22px}</style></head>
<body><div class="wrap"><h1>Snack ゆあ<br><small>店舗管理 v3</small></h1>
<section id="loginPanel" class="panel"><h2>管理者ログイン</h2><input id="emailInput" type="email" placeholder="メールアドレス"><input id="passwordInput" type="password" placeholder="パスワード"><button id="loginButton" type="button">ログイン</button><div id="statusMessage" class="msg">準備OK（v3）</div></section>
<section id="adminPanel" hidden><div class="panel row"><button id="reloadButton" class="sub">会員一覧を更新</button><button id="logoutButton" class="sub">ログアウト</button></div><div class="panel"><h2>新規会員登録</h2><input id="newNameInput" placeholder="お名前"><button id="addButton">会員を登録</button><div id="addMessage" class="msg"></div></div><div class="panel"><h2>会員一覧</h2><input id="searchInput" placeholder="名前・会員番号で検索"><div id="memberList"></div></div></section></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const status=$('statusMessage');
window.addEventListener('error',e=>{status.textContent='画面エラー: '+e.message});
window.addEventListener('unhandledrejection',e=>{status.textContent='通信エラー: '+(e.reason?.message||String(e.reason||'不明'))});
let client, members=[];
try{client=window.supabase.createClient('https://obargoiehxdryqrfxdvw.supabase.co','sb_publishable_B63A2sDLIdK3CXCQLRL0VQ_Ob0VCHSN')}catch(e){status.textContent='接続準備エラー: '+e.message;return}
async function signIn(){status.textContent='ログイン確認中…';const email=$('emailInput').value.trim(),password=$('passwordInput').value;if(!email||!password){status.textContent='メールアドレスとパスワードを入力してください';return}try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error){status.textContent='ログインできません: '+error.message;return}if(!data.session){status.textContent='ログイン情報を取得できません';return}$('loginPanel').hidden=true;$('adminPanel').hidden=false;await loadMembers()}catch(e){status.textContent='通信エラー: '+e.message}}
async function loadMembers(){const box=$('memberList');box.textContent='読み込み中…';const {data,error}=await client.from('members').select('*').order('member_no');if(error){box.textContent='会員一覧エラー: '+error.message;return}members=data||[];render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('searchInput').value.trim().toLowerCase();const list=members.filter(m=>!q||String(m.member_no).includes(q)||String(m.name).toLowerCase().includes(q));$('memberList').innerHTML=list.map(m=>`<div class="member"><b>#${m.member_no} ${esc(m.name)}</b><div class="big">${m.visits} / 15回来店</div><div class="row"><button data-a="plus" data-id="${m.id}" data-v="${m.visits}">＋1 来店</button><button class="sub" data-a="minus" data-id="${m.id}" data-v="${m.visits}">−1 訂正</button></div><div class="row"><button class="sub" data-a="reward" data-id="${m.id}" data-k="reward_5_used" data-val="${!m.reward_5_used}">5回特典 ${m.reward_5_used?'✓使用済':'使用'}</button><button class="sub" data-a="reward" data-id="${m.id}" data-k="reward_10_used" data-val="${!m.reward_10_used}">10回特典 ${m.reward_10_used?'✓使用済':'使用'}</button></div><button class="sub" data-a="reward" data-id="${m.id}" data-k="reward_15_used" data-val="${!m.reward_15_used}">15回 吉四六 ${m.reward_15_used?'✓使用済':'使用'}</button></div>`).join('')||'<p>会員がいません</p>'}
async function update(id,changes){const {error}=await client.from('members').update(changes).eq('id',id);if(error)alert('更新エラー: '+error.message);else await loadMembers()}
$('loginButton').addEventListener('click',signIn);$('reloadButton').addEventListener('click',loadMembers);$('logoutButton').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});$('addButton').addEventListener('click',async()=>{const name=$('newNameInput').value.trim();if(!name){$('addMessage').textContent='お名前を入力してください';return}const {data,error}=await client.from('members').insert({name}).select().single();$('addMessage').textContent=error?'登録エラー: '+error.message:`登録しました（会員番号 #${data.member_no}）`;if(!error){$('newNameInput').value='';await loadMembers()}});$('searchInput').addEventListener('input',render);$('memberList').addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id,v=Number(b.dataset.v);if(b.dataset.a==='plus'){if(v>=15)return alert('15回来店に達しています');await update(id,{visits:v+1})}else if(b.dataset.a==='minus'){if(v>0&&confirm('来店回数を1つ戻しますか？'))await update(id,{visits:v-1})}else await update(id,{[b.dataset.k]:b.dataset.val==='true'})});
client.auth.getSession().then(({data})=>{if(data.session){$('loginPanel').hidden=true;$('adminPanel').hidden=false;loadMembers()}});
})();
</script></body></html>
