<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snack ゆあ 店舗管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b090b;color:#f6ecd6;font-family:system-ui,"Yu Gothic",sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px 60px}h1{text-align:center;color:#e3c172}.panel{background:#171117;border:1px solid #70572c;border-radius:18px;padding:18px;margin:16px 0}input,button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #80652f;font-size:16px}input{background:#0e0b0e;color:white}button{background:linear-gradient(135deg,#b98a36,#f0d58a);color:#1b1208;font-weight:800;opacity:1!important;cursor:pointer!important;filter:none!important;appearance:none!important}button.sub{background:#2a222a;color:#eee}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.member{padding:15px 0;border-bottom:1px solid #403521}.big{font-size:26px;color:#e5c374;font-weight:800}.msg{color:#e5c374;min-height:20px}</style></head><body><div class="wrap"><h1>Snack ゆあ<br><small>店舗管理</small></h1><div id="login" class="panel"><h2>管理者ログイン</h2><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード"><button onclick="login()">ログイン</button><div id="loginmsg" class="msg"></div></div><div id="app" style="display:none"><div class="panel row"><button class="sub" onclick="loadMembers()">会員一覧を更新</button><button class="sub" onclick="logout()">ログアウト</button></div><div class="panel"><h2>新規会員登録</h2><input id="newname" placeholder="お名前"><button onclick="addMember()">会員を登録</button><div id="addmsg" class="msg"></div></div><div class="panel"><h2>会員一覧</h2><input id="search" placeholder="名前・会員番号で検索" oninput="render()"><div id="members"></div></div></div></div><script>
const client=supabase.createClient('https://obargoiehxdryqrfxdvw.supabase.co','sb_publishable_B63A2sDLIdK3CXCQLRL0VQ_Ob0VCHSN');let allMembers=[];
async function login(){let r=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});loginmsg.textContent=r.error?'ログインできません: '+r.error.message:'';if(!r.error)showApp()}
async function logout(){await client.auth.signOut();location.reload()}
async function showApp(){let s=await client.auth.getSession();if(!s.data.session)return;login.style.display='none';app.style.display='block';loadMembers()}
async function loadMembers(){let r=await client.from('members').select('*').order('member_no');if(r.error){members.textContent='読み込みエラー: '+r.error.message;return}allMembers=r.data||[];render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=search.value.trim().toLowerCase();let a=allMembers.filter(m=>!q||String(m.member_no).includes(q)||m.name.toLowerCase().includes(q));members.innerHTML=a.map(m=>`<div class="member"><b>#${m.member_no} ${esc(m.name)}</b><div class="big">${m.visits} / 15回来店</div><div class="row"><button onclick="setVisits('${m.id}',${m.visits+1})">＋1 来店</button><button class="sub" onclick="setVisits('${m.id}',${Math.max(0,m.visits-1)})">−1 訂正</button></div><button class="sub" onclick="reward('${m.id}','reward_5_used',${!m.reward_5_used})">5回 500円OFF：${m.reward_5_used?'使用済':'未使用'}</button><button class="sub" onclick="reward('${m.id}','reward_10_used',${!m.reward_10_used})">10回 1,000円OFF：${m.reward_10_used?'使用済':'未使用'}</button><button class="sub" onclick="reward('${m.id}','reward_15_used',${!m.reward_15_used})">15回 吉四六：${m.reward_15_used?'使用済':'未使用'}</button></div>`).join('')||'会員がいません'}
async function addMember(){let name=newname.value.trim();if(!name)return;let r=await client.from('members').insert({name}).select().single();addmsg.textContent=r.error?'登録エラー: '+r.error.message:`登録しました（会員番号 #${r.data.member_no}）`;if(!r.error){newname.value='';loadMembers()}}
async function setVisits(id,v){if(v>15){alert('15回来店に達しています');return}let r=await client.from('members').update({visits:v}).eq('id',id);if(r.error)alert(r.error.message);else loadMembers()}
async function reward(id,k,v){let r=await client.from('members').update({[k]:v}).eq('id',id);if(r.error)alert(r.error.message);else loadMembers()}
showApp();</script></body></html>
