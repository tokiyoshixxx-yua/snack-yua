<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snack ゆあ MEMBER'S CARD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#34233c 0,#171017 35%,#090809 100%);
color:#f6ecd6;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:28px 18px 48px}
.back{color:#d8b66a;text-decoration:none;font-size:14px}
.card{margin-top:20px;padding:28px 20px;border:1px solid #d7ad58;border-radius:24px;
background:linear-gradient(145deg,#20151f,#0e0b0e);box-shadow:0 22px 60px #0008;text-align:center}
.logo{font-family:Georgia,serif;font-size:34px;color:#e2bf70;letter-spacing:.04em}
.sub{font-size:12px;letter-spacing:.24em;color:#bba36f;margin-top:4px}
.name{margin:24px 0 8px;font-size:20px}
.count{font-size:42px;font-weight:800;color:#f0cf7d}
.count small{font-size:16px;color:#cdbf9e}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:26px 0}
.stamp{aspect-ratio:1;border-radius:50%;border:2px solid #b98c3d;display:flex;align-items:center;justify-content:center;
font-weight:800;color:#d8b66a;background:#120e12}
.stamp.hit{background:radial-gradient(circle,#f2d98c,#b47a25);color:#20130a;border-color:#f4dfa4}
.rewards{text-align:left;margin-top:22px;border-top:1px solid #6e5730;padding-top:18px}
.reward{padding:12px 0;border-bottom:1px solid #403521}
.reward b{color:#e5c374}
.note{font-size:12px;color:#a99c85;line-height:1.7;margin-top:20px}
.demo{margin-top:20px;padding:12px;border-radius:12px;background:#2b202b;color:#d8c9ae;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← ホームページへ戻る</a>
<div class="card">
<div class="logo">Snack ゆあ</div>
<div class="sub">MEMBER'S CARD</div>
<div class="name">会員様</div>
<div class="count">0 <small>/ 15回来店</small></div>
<div class="grid">
<div class="stamp">1</div><div class="stamp">2</div><div class="stamp">3</div><div class="stamp">4</div><div class="stamp">5</div>
<div class="stamp">6</div><div class="stamp">7</div><div class="stamp">8</div><div class="stamp">9</div><div class="stamp">10</div>
<div class="stamp">11</div><div class="stamp">12</div><div class="stamp">13</div><div class="stamp">14</div><div class="stamp">15</div>
</div>
<div class="rewards">
<div class="reward"><b>5回来店</b>　500円OFF</div>
<div class="reward"><b>10回来店</b>　1,000円OFF</div>
<div class="reward"><b>15回来店</b>　吉四六ボトル1本プレゼント 🎁</div>
</div>
<div class="note">15回来店で1周達成。特典の利用・ポイント付与は店舗スタッフが確認します。</div>
</div>
<div class="demo">現在はデザイン確認用の試作版です。ポイント保存・会員登録・店舗側のポイント付与機能は次の段階で接続します。</div>
</div>
<div style="text-align:center;margin:25px"><a href="admin.html" style="color:#756a57;font-size:12px">店舗管理</a></div></body>
</html>
