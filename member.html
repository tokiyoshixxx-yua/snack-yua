<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snack ゆあ MEMBER'S CARD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090709;color:#f8eed9;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;padding:22px 14px}
.card{max-width:430px;margin:auto;background:linear-gradient(145deg,#171117,#090709);border:1px solid #9a7839;border-radius:24px;padding:24px 18px;box-shadow:0 18px 50px #0008}
.brand{text-align:center;color:#e6c36f;font-size:30px;font-weight:800}.sub{text-align:center;letter-spacing:3px;color:#c7a95f;margin:4px 0 20px}
.name{text-align:center;font-size:22px;margin:10px}.count{text-align:center;font-size:30px;color:#e6c36f;font-weight:800;margin:16px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}
.stamp{aspect-ratio:1;border-radius:50%;border:2px solid #80662f;display:grid;place-items:center;color:#80662f;font-weight:800}
.stamp.on{background:#e3bf69;color:#1a1208;border-color:#f1d58a;box-shadow:0 0 15px #c89e4a55}
.rewards{border-top:1px solid #5d4928;margin-top:22px;padding-top:16px;line-height:1.9}.rewards b{color:#e6c36f}
.status{text-align:center;color:#cbbd9f;margin-top:18px;font-size:14px}.used{opacity:.5;text-decoration:line-through}
</style></head>
<body><div class="card">
<div class="brand">Snack ゆあ</div><div class="sub">MEMBER'S CARD</div>
<div id="name" class="name">読み込み中…</div><div id="count" class="count">— / 20回来店</div>
<div id="stamps" class="stamps"></div>
<div class="rewards">
<div id="r5"><b>5回来店</b>　¥500 OFF</div>
<div id="r10"><b>10回来店</b>　¥1,000 OFF</div>
<div id="r15"><b>15回来店</b>　¥1,500 OFF</div>
<div id="r20"><b>20回来店</b>　二階堂プレゼント</div>
</div><div id="status" class="status">店舗で来店回数を更新すると、このカードにも反映されます。</div><div style="text-align:center;margin-top:14px;font-size:13px;color:#a99c85;line-height:1.7">このページをスマホの「ホーム画面に追加」しておくと、次回からすぐ会員証を開けます。</div>
</div>
<script>
const sb=supabase.createClient("https://obargoiehxdryqrfxdvw.supabase.co","sb_publishable_B63A2sDLIdK3CXCQLRL0VQ_Ob0VCHSN");
const token=new URLSearchParams(location.search).get("card");
const stamps=document.getElementById("stamps");
for(let i=1;i<=20;i++) stamps.insertAdjacentHTML("beforeend",`<div class="stamp" id="s${i}">${i}</div>`);
async function load(){
 if(!token){document.getElementById("name").textContent="会員証URLが正しくありません";return}
 const {data,error}=await sb.rpc("get_member_card",{p_token:token});
 if(error){document.getElementById("name").textContent="会員証を読み込めません";document.getElementById("status").textContent=error.message;return}
 const m=Array.isArray(data)?data[0]:data;
 if(!m){document.getElementById("name").textContent="会員証が見つかりません";return}
 document.getElementById("name").textContent=(m.name||"会員")+" 様";
 document.getElementById("count").textContent=`${m.visits} / 20回来店`;
 for(let i=1;i<=20;i++) document.getElementById("s"+i).classList.toggle("on",i<=m.visits);
 if(m.reward_5_used)document.getElementById("r5").classList.add("used");
 if(m.reward_10_used)document.getElementById("r10").classList.add("used");
 if(m.reward_15_used)document.getElementById("r15").classList.add("used");
 document.getElementById("r20").innerHTML = Number(m.member_no)===2 ? '<b>20回来店</b>　二階堂＋テキーラショット1杯プレゼント' : '<b>20回来店</b>　二階堂プレゼント';
 if(m.reward_20_used)document.getElementById("r20").classList.add("used");
}
load();
</script></body></html>
